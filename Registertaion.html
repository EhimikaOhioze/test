<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Prime trust.css">

    <title>Customer Registration | PrimeTrust Bank</title>

</head>


<body>

    <!-- HEADER -->

    <header>

        <h1>PrimeTrust Bank</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="customer-profile.html">Profile</a>

            <a href="accounts.html">Accounts</a>

            <a href="transactions.html">Transactions</a>

            <a href="customer-registration.html">Register</a>

        </nav>

    </header>


    <!-- MAIN CONTENT -->

    <main>

        <!-- PAGE INTRODUCTION -->

        <section>

            <h2>Customer Registration</h2>

            <p>
                Create your PrimeTrust Bank account by completing
                the registration form below.
            </p>

            <p>
                Please provide accurate information.
            </p>

        </section>


        <!-- REGISTRATION FORM -->

        <form action="#" method="post">


            <!-- PERSONAL INFORMATION -->

            <fieldset>

                <legend>Personal Information</legend>


                <p>

                    <label for="first-name">
                        First Name:
                    </label>

                    <br>

                    <input
                        type="text"
                        id="first-name"
                        name="first-name"
                        placeholder="Enter your first name"
                        required
                    >

                </p>


                <p>

                    <label for="middle-name">
                        Middle Name:
                    </label>

                    <br>

                    <input
                        type="text"
                        id="middle-name"
                        name="middle-name"
                        placeholder="Enter your middle name"
                    >

                </p>


                <p>

                    <label for="last-name">
                        Last Name:
                    </label>

                    <br>

                    <input
                        type="text"
                        id="last-name"
                        name="last-name"
                        placeholder="Enter your last name"
                        required
                    >

                </p>


                <p>

                    <label for="date-of-birth">
                        Date of Birth:
                    </label>

                    <br>

                    <input
                        type="date"
                        id="date-of-birth"
                        name="date-of-birth"
                        required
                    >

                </p>


                <p>

                    <strong>Gender:</strong>

                    <br>

                    <input
                        type="radio"
                        id="male"
                        name="gender"
                        value="male"
                        required
                    >

                    <label for="male">
                        Male
                    </label>


                    <br>


                    <input
                        type="radio"
                        id="female"
                        name="gender"
                        value="female"
                    >

                    <label for="female">
                        Female
                    </label>

                </p>

            </fieldset>


            <!-- CONTACT INFORMATION -->

            <fieldset>

                <legend>Contact Information</legend>


                <p>

                    <label for="email">
                        Email Address:
                    </label>

                    <br>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >
