<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="Prime trust.css">
    <title>Update Profile | PrimeTrust Bank</title>

</head>


<body class="page">

    <header class="site-header">

        <h1>PrimeTrust Bank</h1>

        <nav class="main-nav">

            <a href="Prime trust.html">Home</a>

            <a href="Customer Profile.html">Profile</a>

            <a href="Accounts.html">Accounts</a>

            <a href="Transactions.html">Transactions</a>

            <a href="Transfer.html">Transfer Money</a>

            <a href="Support.html">Support</a>

        </nav>

    </header>


    <main class="main-content">

        <section class="page-intro">

            <h2>Update Profile</h2>

            <p>
                Update your personal and contact information.
            </p>

        </section>


        <section>

            <form class="form-card form-grid" action="#" method="post">


                <p class="form-group">

                    <label for="first-name">
                        First Name:
                    </label>

                    <br>

                    <input
                        type="text"
                        id="first-name"
                        name="first-name"
                        value="John"
                        required
                    >

                </p>


                <p class="form-group">

                    <label for="last-name">
                        Last Name:
                    </label>

                    <br>

                    <input
                        type="text"
                        id="last-name"
                        name="last-name"
                        value="Doe"
                        required
                    >

                </p>


                <p class="form-group">

                    <label for="email">
                        Email Address:
                    </label>

                    <br>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="john.doe@example.com"
                        required
                    >

                </p>


                <p class="form-group">

                    <label for="phone">
                        Phone Number:
                    </label>

                    <br>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        value="08012345678"
                        required
                    >

                </p>


                <p class="form-group">

                    <label for="date-of-birth">
                        Date of Birth:
                    </label>

                    <br>

                    <input
                        type="date"
                        id="date-of-birth"
                        name="date-of-birth"
                        value="1998-01-15"
                    >

                </p>


                <p class="form-group">

                    <label for="address">
                        Address:
                    </label>

                    <br>

                    <textarea
                        id="address"
                        name="address"
                        rows="5"
                        cols="40"
                    >Abuja, Nigeria</textarea>

                </p>


                <p class="form-group">

                    <label for="occupation">
                        Occupation:
                    </label>

                    <br>

                    <input
                        type="text"
                        id="occupation"
                        name="occupation"
                        value="Software Developer"
                    >

                </p>


                <p class="form-group">

                    <button class="button" type="submit">
                        Save Changes
                    </button>

                </p>

            </form>

        </section>


        <section class="content-section">

            <p>
                <a href="Customer Profile.html">
                    Back to Profile
                </a>
            </p>

        </section>

    </main>


    <footer class="site-footer">

        <p>
            &copy; 2026 PrimeTrust Bank. All Rights Reserved.
        </p>

    </footer>


</body>

</html>
